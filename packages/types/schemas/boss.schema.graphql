"""
Filecoin Boss GraphQL client contract. Entity fields are a strict subset of
snissn/filecoin-boss main commit 43786a88c726e85a24988d90c234eae220e58686.
"""
scalar BigInt
scalar Bytes

enum OrderDirection {
  asc
  desc
}

enum SubscriptionState {
  PENDING_ACTIVATION
  ACTIVE
  PAUSED
  TERMINATING
  ENDED
  EXHAUSTED
}

type BossAccount {
  id: ID!
  chainId: BigInt!
  factory: Bytes!
  address: Bytes!
  owner: Bytes!
  filecoinPay: Bytes!
  serviceRegistry: Bytes!
  adapterRegistry: Bytes!
  accountVersion: BigInt!
  accountKey: Bytes!
  createdBlock: BigInt!
  createdTransaction: Bytes!
}

type BossService {
  id: ID!
  chainId: BigInt!
  serviceRegistry: Bytes!
  providerAddress: Bytes!
  serviceId: Bytes!
  serviceType: Bytes!
  version: BigInt!
  providerRevision: BigInt!
  metadataURI: String!
  published: Boolean!
  updatedBlock: BigInt!
  updatedTransaction: Bytes!
}

type ResourceSubscription {
  id: ID!
  chainId: BigInt!
  bossAccount: Bytes!
  subscriptionId: Bytes!
  resourceKey: Bytes!
  active: Boolean!
  createdBlock: BigInt!
  createdTransaction: Bytes!
}

type Subscription {
  id: ID!
  chainId: BigInt!
  accountAddress: Bytes!
  subscriptionId: Bytes!
  offerHash: Bytes!
  resourceKey: Bytes!
  railId: BigInt!
  beneficiary: Bytes!
  token: Bytes!
  provider: Bytes!
  reporter: Bytes!
  resourceAdapter: Bytes!
  pricingAdapter: Bytes!
  resourceDataHash: Bytes!
  pricingDataHash: Bytes!
  accessGrantHash: Bytes!
  policyWord: BigInt!
  billingKind: Int!
  assuranceKind: Int!
  dependencyKind: Int!
  activationKind: Int!
  terminationBillingKind: Int!
  pauseAllowed: Boolean!
  maxRatePerEpoch: BigInt!
  maxFixedLockup: BigInt!
  maxSingleCharge: BigInt!
  maxChargePerWindow: BigInt!
  lifetimeCapGross: BigInt!
  chargeWindowEpochs: BigInt!
  notAfterEpoch: BigInt!
  maxLockupPeriod: BigInt!
  acceptedRatePerEpoch: BigInt!
  acceptedEpoch: BigInt!
  quoteEpoch: BigInt
  quoteValidThroughEpoch: BigInt!
  quoteTtlEpochs: BigInt!
  currentFixedBudget: BigInt!
  totalRawGross: BigInt!
  totalChargedGross: BigInt!
  claimCount: BigInt!
  provisioningHash: Bytes
  resourceStatusHash: Bytes
  activatedEpoch: BigInt
  pausedEpoch: BigInt
  resumedEpoch: BigInt
  terminationRequestedEpoch: BigInt
  payEndEpoch: BigInt
  finalSettledEpoch: BigInt
  pauseRateUpdateDeferred: Boolean!
  state: SubscriptionState!
  requiresAccountRead: Boolean!
  createdBlock: BigInt!
  createdTransaction: Bytes!
}

type UsageClaim {
  id: ID!
  chainId: BigInt!
  bossAccount: Bytes!
  subscriptionId: Bytes!
  claimId: Bytes!
  claimHash: Bytes!
  units: BigInt!
  rawGross: BigInt!
  chargedGross: BigInt!
  evidenceHash: Bytes!
  transactionHash: Bytes!
  blockNumber: BigInt!
  logIndex: BigInt!
}

type RailSubscription {
  id: ID!
  chainId: BigInt!
  filecoinPay: Bytes!
  bossAccount: Bytes!
  subscriptionId: Bytes!
  railId: BigInt!
  payer: Bytes!
  payee: Bytes!
  operator: Bytes!
  token: Bytes!
  active: Boolean!
  createdBlock: BigInt!
  createdTransaction: Bytes!
}

type _Block_ {
  hash: Bytes
  number: Int!
  timestamp: BigInt
}

type _Meta_ {
  block: _Block_!
  deployment: String!
  hasIndexingErrors: Boolean!
}

input Block_height {
  hash: Bytes
  number: Int
  number_gte: Int
}

input BossAccount_filter {
  id: ID
  address: Bytes
  owner: Bytes
}

input BossService_filter {
  id: ID
  providerAddress: Bytes
  serviceId: Bytes
  serviceType: Bytes
  published: Boolean
}

input ResourceSubscription_filter {
  id: ID
  bossAccount: Bytes
  resourceKey: Bytes
  subscriptionId: Bytes
  active: Boolean
}

input Subscription_filter {
  id: ID
  accountAddress: Bytes
  subscriptionId: Bytes
  railId: BigInt
  resourceKey: Bytes
  provider: Bytes
  state: SubscriptionState
}

input UsageClaim_filter {
  id: ID
  bossAccount: Bytes
  subscriptionId: Bytes
  claimId: Bytes
}

input RailSubscription_filter {
  id: ID
  chainId: BigInt
  filecoinPay: Bytes
  bossAccount: Bytes
  subscriptionId: Bytes
  railId: BigInt
  active: Boolean
}

enum BossAccount_orderBy {
  id
  address
  owner
  createdBlock
}

enum BossService_orderBy {
  id
  providerAddress
  serviceId
  version
  updatedBlock
}

enum ResourceSubscription_orderBy {
  id
  resourceKey
  subscriptionId
  createdBlock
}

enum Subscription_orderBy {
  id
  subscriptionId
  railId
  state
  acceptedEpoch
  activatedEpoch
  finalSettledEpoch
}

enum UsageClaim_orderBy {
  id
  subscriptionId
  claimId
  blockNumber
}

enum RailSubscription_orderBy {
  id
  subscriptionId
  railId
  createdBlock
}

type Query {
  _meta(block: Block_height): _Meta_
  bossAccount(id: ID!, block: Block_height): BossAccount
  bossAccounts(
    first: Int = 100
    skip: Int = 0
    where: BossAccount_filter
    orderBy: BossAccount_orderBy
    orderDirection: OrderDirection
    block: Block_height
  ): [BossAccount!]!
  bossService(id: ID!, block: Block_height): BossService
  bossServices(
    first: Int = 100
    skip: Int = 0
    where: BossService_filter
    orderBy: BossService_orderBy
    orderDirection: OrderDirection
    block: Block_height
  ): [BossService!]!
  resourceSubscription(id: ID!, block: Block_height): ResourceSubscription
  resourceSubscriptions(
    first: Int = 100
    skip: Int = 0
    where: ResourceSubscription_filter
    orderBy: ResourceSubscription_orderBy
    orderDirection: OrderDirection
    block: Block_height
  ): [ResourceSubscription!]!
  subscription(id: ID!, block: Block_height): Subscription
  subscriptions(
    first: Int = 100
    skip: Int = 0
    where: Subscription_filter
    orderBy: Subscription_orderBy
    orderDirection: OrderDirection
    block: Block_height
  ): [Subscription!]!
  usageClaims(
    first: Int = 100
    skip: Int = 0
    where: UsageClaim_filter
    orderBy: UsageClaim_orderBy
    orderDirection: OrderDirection
    block: Block_height
  ): [UsageClaim!]!
  railSubscriptions(
    first: Int = 100
    skip: Int = 0
    where: RailSubscription_filter
    orderBy: RailSubscription_orderBy
    orderDirection: OrderDirection
    block: Block_height
  ): [RailSubscription!]!
}
