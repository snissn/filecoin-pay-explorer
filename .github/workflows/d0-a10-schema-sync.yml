name: Qualify exact A10 client schema synchronization

on:
  push:
    branches:
      - gpt56/issue-14-boss-a10-schema-sync
    paths:
      - ".github/workflows/d0-a10-schema-sync.yml"

permissions:
  contents: write

concurrency:
  group: d0-a10-schema-sync
  cancel-in-progress: false

jobs:
  qualify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact trigger
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify isolated trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "0419b5580084dfee56eae12ba4920cc9ae97fad1"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/d0-a10-schema-sync.yml"
          test -f .github/scripts/d0_a10_schema_sync.py

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Apply bounded D0 schema repair
        run: python .github/scripts/d0_a10_schema_sync.py

      - name: Format repaired source
        run: >-
          pnpm exec biome check --write
          apps/explorer/src/components/BossPayAssociation/index.tsx
          apps/explorer/src/components/BossService/index.tsx
          apps/explorer/src/components/BossServices/index.tsx
          apps/explorer/src/services/boss
          packages/types/README.md
          packages/types/scripts/validate-boss-client-schema.mjs
          packages/types/schemas/boss.schema.graphql

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch and verify authoritative A10 schema
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/snissn/filecoin-boss/43786a88c726e85a24988d90c234eae220e58686/packages/subgraph/schema.graphql \
            --output /tmp/a10.schema.graphql
          echo "c259c38ffe378115cd843c687a422b0297c0c62940aa6878666439eafbb287ee  /tmp/a10.schema.graphql" | sha256sum --check
          node packages/types/scripts/validate-boss-client-schema.mjs /tmp/a10.schema.graphql

      - name: Generate and build distinct Boss types
        run: pnpm --filter @filecoin-pay/types build

      - name: Run complete Boss regression suite
        run: pnpm --filter @filecoin-pay/explorer test -- src/services/boss

      - name: Type check D0, D1, and D2 consumers
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @filecoin-pay/types type-check
          pnpm --filter @filecoin-pay/explorer exec tsc --project tsconfig.boss-d0.json --noEmit
          pnpm --filter @filecoin-pay/explorer exec tsc --project tsconfig.boss-d1.json --noEmit
          pnpm --filter @filecoin-pay/explorer exec tsc --project tsconfig.boss-d2.json --noEmit

      - name: Build monorepo
        run: pnpm build
        env:
          NEXT_PUBLIC_SUBGRAPH_URL_MAINNET: https://placeholder.invalid/mainnet
          NEXT_PUBLIC_SUBGRAPH_URL_CALIBRATION: https://placeholder.invalid/calibration

      - name: Check repaired source
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec biome ci \
            apps/explorer/src/components/BossPayAssociation/index.tsx \
            apps/explorer/src/components/BossService/index.tsx \
            apps/explorer/src/components/BossServices/index.tsx \
            apps/explorer/src/services/boss \
            packages/types/scripts/validate-boss-client-schema.mjs
          git diff --check

      - name: Upload exact qualified repair
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d0-a10-schema-sync
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/explorer/src/components/BossPayAssociation/index.tsx
            apps/explorer/src/components/BossService/index.tsx
            apps/explorer/src/components/BossServices/index.tsx
            apps/explorer/src/services/boss/association-client.test.ts
            apps/explorer/src/services/boss/association.test.ts
            apps/explorer/src/services/boss/association.ts
            apps/explorer/src/services/boss/client-request.test.ts
            apps/explorer/src/services/boss/client.ts
            apps/explorer/src/services/boss/presentation.test.ts
            apps/explorer/src/services/boss/presentation.ts
            apps/explorer/src/services/boss/queries.ts
            packages/types/README.md
            packages/types/schemas/boss.schema.graphql
            packages/types/scripts/validate-boss-client-schema.mjs

      - name: Publish exact source repair under head lease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            apps/explorer/src/components/BossPayAssociation/index.tsx
            apps/explorer/src/components/BossService/index.tsx
            apps/explorer/src/components/BossServices/index.tsx
            apps/explorer/src/services/boss/association-client.test.ts
            apps/explorer/src/services/boss/association.test.ts
            apps/explorer/src/services/boss/association.ts
            apps/explorer/src/services/boss/client-request.test.ts
            apps/explorer/src/services/boss/client.ts
            apps/explorer/src/services/boss/presentation.test.ts
            apps/explorer/src/services/boss/presentation.ts
            apps/explorer/src/services/boss/queries.ts
            packages/types/README.md
            packages/types/schemas/boss.schema.graphql
            packages/types/scripts/validate-boss-client-schema.mjs
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          expected=$(printf '%s\n' "${paths[@]}" | sort)
          actual=$(git diff --cached --name-only | sort)
          test "$actual" = "$expected"
          git commit -m "fix(explorer): synchronize with merged A10 schema"
          auth_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          remote_head=$(git ls-remote "$auth_url" refs/heads/gpt56/issue-14-boss-a10-schema-sync | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          git push "$auth_url" "HEAD:refs/heads/gpt56/issue-14-boss-a10-schema-sync"
