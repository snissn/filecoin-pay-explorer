# This action adds all issues and PRs to the FS project board.
# It is used to keep the project board up to date with the issues and PRs.
# It is triggered by the issue and PR events.
# When `FILOZZY_CI_ADD_TO_PROJECT` is not configured in a fork, the workflow records a clean skip instead of failing every opened PR.
name: Add issues and PRs to FS project board

on:
  issues:
    types:
      - opened
  # Using "pull_request_target" instead of "pull_request" to support PRs from forks.
  # This action does not check out or execute contributor code.
  pull_request_target:
    types:
      - opened

jobs:
  add-to-project:
    name: Add all issues and prs to project
    runs-on: ubuntu-latest
    env:
      PROJECT_TOKEN: ${{ secrets.FILOZZY_CI_ADD_TO_PROJECT }}
    steps:
      - name: Project token not configured
        if: env.PROJECT_TOKEN == ''
        run: echo "FILOZZY_CI_ADD_TO_PROJECT is not configured; skipping optional FilOzone project-board synchronization."

      - name: Add item to FilOzone project
        if: env.PROJECT_TOKEN != ''
        uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: https://github.com/orgs/FilOzone/projects/14
          github-token: ${{ env.PROJECT_TOKEN }}
