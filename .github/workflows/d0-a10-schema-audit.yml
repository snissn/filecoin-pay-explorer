name: Audit Explorer against live A10 schema

on:
  push:
    branches:
      - gpt56/issue-14-boss-a10-schema-sync
    paths:
      - ".github/workflows/d0-a10-schema-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Fetch exact merged A10 schema
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/snissn/filecoin-boss/43786a88c726e85a24988d90c234eae220e58686/packages/subgraph/schema.graphql \
            --output /tmp/a10.schema.graphql
          sha256sum /tmp/a10.schema.graphql packages/types/schemas/boss.schema.graphql

      - name: Enumerate stale client-field consumers
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== old schema field consumers ==='
            grep -RInE '\b(bossAccount|ratePerEpoch|fixedBudget|observedUsage|validator|transactionHash|blockNumber)\b' \
              packages/types/schemas/boss.schema.graphql \
              apps/explorer/src/services/boss \
              apps/explorer/src/components/Boss* \
              'apps/explorer/src/app/[network]/services' \
              apps/explorer/src/hooks/useBossPayRailAssociation.ts || true
            echo '=== old state consumers ==='
            grep -RIn 'ACCEPTED' \
              packages/types/schemas/boss.schema.graphql \
              apps/explorer/src/services/boss \
              apps/explorer/src/components/Boss* \
              'apps/explorer/src/app/[network]/services' || true
            echo '=== complete Boss source file set ==='
            find apps/explorer/src/services/boss apps/explorer/src/components -maxdepth 3 -type f | sort
          } | tee /tmp/d0-a10-schema-audit.txt

      - name: Upload audit receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d0-a10-schema-audit
          if-no-files-found: error
          path: |
            /tmp/a10.schema.graphql
            /tmp/d0-a10-schema-audit.txt
            packages/types/schemas/boss.schema.graphql
