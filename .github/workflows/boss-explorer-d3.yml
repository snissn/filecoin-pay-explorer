name: Boss Explorer D3

on:
  pull_request:
    paths:
      - "apps/explorer/tsconfig.boss-d3.json"
      - "apps/explorer/src/app/[network]/services/[id]/page.tsx"
      - "apps/explorer/src/components/BossLifecycleConsole/**"
      - "apps/explorer/src/components/BossService/**"
      - "apps/explorer/src/hooks/useBossPayRailAssociation.ts"
      - "apps/explorer/src/services/boss/association*"
      - "apps/explorer/src/services/boss/lifecycle*"
      - ".github/workflows/boss-explorer-d3.yml"
      - ".github/workflows/d3-sdk-shape-repair*.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    name: D3 explicit lifecycle console
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Reject deferred self-modifying repairs
        run: |
          test ! -e .github/workflows/d3-sdk-shape-repair.yml
          test ! -e .github/workflows/d3-sdk-shape-repair-r2.yml

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate and build distinct Boss and Pay types
        run: pnpm --filter @filecoin-pay/types build

      - name: Run Boss lifecycle and inherited regressions
        run: pnpm --filter @filecoin-pay/explorer test -- src/services/boss

      - name: Type check D0 through D3 consumers
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @filecoin-pay/types type-check
          pnpm --filter @filecoin-pay/explorer exec tsc --project tsconfig.boss-d0.json --noEmit
          pnpm --filter @filecoin-pay/explorer exec tsc --project tsconfig.boss-d1.json --noEmit
          pnpm --filter @filecoin-pay/explorer exec tsc --project tsconfig.boss-d2.json --noEmit
          pnpm --filter @filecoin-pay/explorer exec tsc --project tsconfig.boss-d3.json --noEmit

      - name: Build monorepo
        run: pnpm build
        env:
          NEXT_PUBLIC_SUBGRAPH_URL_MAINNET: https://placeholder.invalid/mainnet
          NEXT_PUBLIC_SUBGRAPH_URL_CALIBRATION: https://placeholder.invalid/calibration

      - name: Check D3 formatting and lint
        run: >-
          pnpm exec biome ci
          apps/explorer/tsconfig.boss-d3.json
          apps/explorer/src/app/[network]/services/[id]/page.tsx
          apps/explorer/src/components/BossLifecycleConsole
          apps/explorer/src/components/BossService
          apps/explorer/src/hooks/useBossPayRailAssociation.ts
          apps/explorer/src/services/boss/association.test.ts
          apps/explorer/src/services/boss/association.ts
          apps/explorer/src/services/boss/lifecycle.test.ts
          apps/explorer/src/services/boss/lifecycle.ts
