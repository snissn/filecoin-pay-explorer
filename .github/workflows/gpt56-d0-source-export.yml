name: GPT56 D0 source export

on:
  push:
    branches:
      - gpt56/issue-14-boss-graphql-config
    paths:
      - .github/workflows/gpt56-d0-source-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Package source
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=node_modules --exclude=.next --exclude=dist -czf /tmp/d0-source.tar.gz .
          git rev-parse HEAD > /tmp/source-head.txt
          sha256sum /tmp/d0-source.tar.gz /tmp/source-head.txt > /tmp/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: gpt56-d0-source
          path: |
            /tmp/d0-source.tar.gz
            /tmp/source-head.txt
            /tmp/SHA256SUMS
          retention-days: 1
          if-no-files-found: error
