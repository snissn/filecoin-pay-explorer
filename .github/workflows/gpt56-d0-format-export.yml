name: D0 Exact Formatter Export

on:
  push:
    branches:
      - gpt56/issue-14-boss-graphql-config
    paths:
      - ".github/workflows/gpt56-d0-format-export.yml"
      - ".github/workflows/boss-explorer-d0.yml"
      - "apps/explorer/.env.example"
      - "apps/explorer/README.md"
      - "apps/explorer/src/hooks/useBossGraphQLQuery.ts"
      - "apps/explorer/src/services/boss/**"
      - "packages/types/README.md"
      - "packages/types/boss-codegen.yml"
      - "packages/types/package.json"
      - "packages/types/schemas/boss.schema.graphql"
      - "packages/types/src/boss.ts"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply exact repository formatter
        run: >-
          pnpm exec biome check --write
          .github/workflows/boss-explorer-d0.yml
          apps/explorer/.env.example
          apps/explorer/README.md
          apps/explorer/src/hooks/useBossGraphQLQuery.ts
          apps/explorer/src/services/boss
          packages/types/README.md
          packages/types/boss-codegen.yml
          packages/types/package.json
          packages/types/schemas/boss.schema.graphql
          packages/types/src/boss.ts

      - name: Export formatted source
        uses: actions/upload-artifact@v4
        with:
          name: d0-formatted-source
          if-no-files-found: error
          path: |
            .github/workflows/boss-explorer-d0.yml
            apps/explorer/.env.example
            apps/explorer/README.md
            apps/explorer/src/hooks/useBossGraphQLQuery.ts
            apps/explorer/src/services/boss
            packages/types/README.md
            packages/types/boss-codegen.yml
            packages/types/package.json
            packages/types/schemas/boss.schema.graphql
            packages/types/src/boss.ts
