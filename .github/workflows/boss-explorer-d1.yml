name: Boss Explorer D1

on:
  pull_request:
    paths:
      - "apps/explorer/tsconfig.boss-d1.json"
      - "apps/explorer/src/app/[network]/services/**"
      - "apps/explorer/src/components/BossService/**"
      - "apps/explorer/src/components/BossServices/**"
      - "apps/explorer/src/components/shared/Header.tsx"
      - "apps/explorer/src/services/boss/**"
      - ".github/workflows/boss-explorer-d1.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    name: D1 signer-free reads
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate and build distinct Boss types
        run: pnpm --filter @filecoin-pay/types build

      - name: Run Boss data and presentation tests
        run: pnpm --filter @filecoin-pay/explorer test -- src/services/boss

      - name: Type check D1 surface
        run: pnpm --filter @filecoin-pay/explorer exec tsc --project tsconfig.boss-d1.json --noEmit

      - name: Build monorepo
        run: pnpm build
        env:
          NEXT_PUBLIC_SUBGRAPH_URL_MAINNET: https://placeholder.invalid/mainnet
          NEXT_PUBLIC_SUBGRAPH_URL_CALIBRATION: https://placeholder.invalid/calibration

      - name: Check D1 formatting and lint
        run: >-
          pnpm exec biome ci
          apps/explorer/tsconfig.boss-d1.json
          apps/explorer/src/app/[network]/services
          apps/explorer/src/components/BossService
          apps/explorer/src/components/BossServices
          apps/explorer/src/components/shared/Header.tsx
          apps/explorer/src/services/boss
