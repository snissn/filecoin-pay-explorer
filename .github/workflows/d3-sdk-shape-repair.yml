name: Qualify exact Synapse lifecycle shape

on:
  push:
    branches:
      - gpt56/issue-17-boss-console-release
    paths:
      - ".github/workflows/d3-sdk-shape-repair.yml"

permissions:
  contents: write

concurrency:
  group: d3-sdk-shape-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact trigger
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Verify isolated trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "783c751a1a23b3eb7105294b3c0bbe880d1b02cb"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/d3-sdk-shape-repair.yml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bind the console to the exact Synapse tracker API
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one occurrence of {old!r}")
              file.write_text(text.replace(old, new, 1))

          lifecycle = Path("apps/explorer/src/services/boss/lifecycle.ts")
          text = lifecycle.read_text()
          start = text.index("export interface BossLifecycleManagerResult")
          end = text.index("export type BossServicesResolution", start)
          manager_types = '''export interface BossLifecycleTransactionEvidence {
            stage?: string;
            txHash?: string;
            receipt?: unknown;
          }

          export interface BossLifecycleManagerResult {
            stage?: string;
            transactions: readonly BossLifecycleTransactionEvidence[];
            raw: unknown;
          }

          export interface BossServicesManagerLike {
            get(input: BossLifecycleReference): Promise<unknown>;
            reconcile(input: BossLifecycleReference): Promise<unknown>;
            sync(input: BossLifecycleReference): Promise<unknown>;
            topUp(input: BossLifecycleReference & { newFixedBudget: bigint }): Promise<unknown>;
            pause(input: BossLifecycleReference): Promise<unknown>;
            resume(input: BossLifecycleReference): Promise<unknown>;
            stop(input: BossLifecycleReference): Promise<unknown>;
          }

          '''
          text = text[:start] + manager_types + text[end:]

          start = text.index("export async function executeBossLifecycleReview(")
          end = text.index("export function serializeBossLifecycleEvidence", start)
          execution = '''export async function executeBossLifecycleReview(
            manager: BossServicesManagerLike,
            review: BossLifecycleReview,
            current: BossLifecycleCurrentContext,
          ): Promise<BossLifecycleExecutionReceipt> {
            const mismatches = compareBossLifecycleReview(review, current);
            if (mismatches.length > 0) {
              throw new BossLifecycleError(
                "STALE_REVIEW",
                "Wallet, chain, account, subscription, or rail changed after review",
                mismatches.map((mismatch) => `${mismatch.field}: reviewed=${mismatch.reviewed}, current=${mismatch.current}`),
              );
            }

            const reference = { account: review.account, subscriptionId: review.subscriptionId };
            let rawResult: unknown;
            let executionError: string | undefined;
            let partialCompletion: BossLifecyclePartialCompletion | undefined;

            try {
              switch (review.action) {
                case "sync":
                  rawResult = await manager.sync(reference);
                  break;
                case "top-up":
                  rawResult = await manager.topUp({ ...reference, newFixedBudget: review.amount as bigint });
                  break;
                case "pause":
                  rawResult = await manager.pause(reference);
                  break;
                case "resume":
                  rawResult = await manager.resume(reference);
                  break;
                case "stop":
                  rawResult = await manager.stop(reference);
                  break;
              }
            } catch (error) {
              partialCompletion = normalizePartialCompletion(error);
              if (!partialCompletion) {
                executionError = errorMessage(error);
              }
            }

            const reconciliation = await reconcileAfterExecution(manager, reference);
            if (partialCompletion) {
              return {
                review,
                status: "partial",
                result: {
                  stage: partialCompletion.failedStage,
                  transactions: partialCompletion.completed,
                  raw: partialCompletion.raw,
                },
                error: partialCompletion.message,
                reconciliation,
              };
            }
            if (executionError !== undefined) {
              return {
                review,
                status: "failed",
                error: executionError,
                reconciliation,
              };
            }

            return {
              review,
              status: "succeeded",
              result: normalizeManagerResult(rawResult),
              reconciliation,
            };
          }

          interface BossLifecyclePartialCompletion {
            failedStage?: string;
            completed: readonly BossLifecycleTransactionEvidence[];
            message: string;
            raw: Record<string, unknown>;
          }

          function normalizeManagerResult(value: unknown): BossLifecycleManagerResult {
            if (!isRecord(value)) {
              return { transactions: [], raw: value };
            }
            const source = Array.isArray(value.transactions)
              ? value.transactions
              : Array.isArray(value.completed)
                ? value.completed
                : [value];
            return {
              stage: stringField(value, "stage"),
              transactions: normalizeTransactionList(source),
              raw: value,
            };
          }

          function normalizePartialCompletion(error: unknown): BossLifecyclePartialCompletion | undefined {
            if (
              !isRecord(error) ||
              error.name !== "BossServicesPartialCompletionError" ||
              !Array.isArray(error.completed)
            ) {
              return undefined;
            }
            const failedStage = stringField(error, "failedStage");
            const baseMessage = error instanceof Error ? error.message : "Filecoin Boss operation partially completed";
            const cause = "cause" in error && error.cause !== undefined ? errorMessage(error.cause) : undefined;
            const message = cause && cause !== baseMessage ? `${baseMessage}: ${cause}` : baseMessage;
            return {
              failedStage,
              completed: normalizeTransactionList(error.completed),
              message,
              raw: {
                name: error.name,
                failedStage,
                message: baseMessage,
                cause,
              },
            };
          }

          function normalizeTransactionList(values: readonly unknown[]): BossLifecycleTransactionEvidence[] {
            return values
              .map((value) => normalizeTransaction(value))
              .filter((value): value is BossLifecycleTransactionEvidence => value !== null);
          }

          function normalizeTransaction(value: unknown): BossLifecycleTransactionEvidence | null {
            if (!isRecord(value)) {
              return null;
            }
            const stage = stringField(value, "stage");
            const txHash = stringField(value, "hash") ?? stringField(value, "txHash");
            if (stage === undefined && txHash === undefined && !("receipt" in value)) {
              return null;
            }
            return {
              stage,
              txHash,
              receipt: "receipt" in value ? value.receipt : undefined,
            };
          }

          function stringField(value: Record<string, unknown>, field: string): string | undefined {
            return typeof value[field] === "string" ? value[field] : undefined;
          }

          '''
          lifecycle.write_text(text[:start] + execution + text[end:])

          tests = Path("apps/explorer/src/services/boss/lifecycle.test.ts")
          text = tests.read_text()
          text = text.replace("  type BossLifecycleManagerResult,\n", "", 1)
          start = text.index("function manager(")
          end = text.index("function review(", start)
          manager_fixture = '''function evidence(stage: string, digit = "f") {
            return { stage, hash: HASH(digit), receipt: null };
          }

          function manager(overrides: Partial<BossServicesManagerLike> = {}) {
            return {
              get: vi.fn(async () => ({ state: "ACTIVE" })),
              reconcile: vi.fn(async () => ({ boss: { state: "ACTIVE" }, pay: { railId: 42n } })),
              sync: vi.fn(async () => evidence("sync")),
              topUp: vi.fn(async () => evidence("top-up")),
              pause: vi.fn(async () => evidence("pause")),
              resume: vi.fn(async () => evidence("resume")),
              stop: vi.fn(async () => evidence("stop")),
              ...overrides,
            } satisfies BossServicesManagerLike;
          }

          '''
          text = text[:start] + manager_fixture + text[end:]
          old = '''    expect(receipt.status).toBe("succeeded");
            expect(services.sync).toHaveBeenCalledTimes(1);
          '''
          new = '''    expect(receipt.status).toBe("succeeded");
            expect(receipt.result?.transactions).toEqual([{ stage: "sync", txHash: HASH("f"), receipt: null }]);
            expect(services.sync).toHaveBeenCalledWith({ account: ADDRESS("2"), subscriptionId: HASH("3") });
            expect(services.sync).toHaveBeenCalledTimes(1);
          '''
          if text.count(old) != 1:
              raise SystemExit("success receipt assertion no longer matches reviewed head")
          text = text.replace(old, new, 1)
          old = '''    expect(services.topUp).toHaveBeenCalledWith({
              account: ADDRESS("2"),
              subscriptionId: HASH("3"),
              amount: 100n,
            });
          '''
          new = '''    expect(services.topUp).toHaveBeenCalledWith({
              account: ADDRESS("2"),
              subscriptionId: HASH("3"),
              newFixedBudget: 100n,
            });
          '''
          if text.count(old) != 1:
              raise SystemExit("top-up assertion no longer matches reviewed head")
          text = text.replace(old, new, 1)
          start = text.index('  it("retains partial failure evidence and still reconciles once"')
          end = text.index('  it("captures thrown wallet errors', start)
          partial_test = '''  it("retains exact SDK partial-completion evidence and still reconciles once", async () => {
            const partial = Object.assign(new Error('Filecoin Boss operation failed at stage "pause".'), {
              name: "BossServicesPartialCompletionError",
              failedStage: "pause",
              completed: [evidence("approve-operator", "a")],
              cause: new Error("pause reverted"),
            });
            const services = manager({ pause: vi.fn(async () => Promise.reject(partial)) });
            const receipt = await executeBossLifecycleReview(services, review("pause"), current());
            expect(receipt.status).toBe("partial");
            expect(receipt.error).toContain("pause reverted");
            expect(receipt.result?.stage).toBe("pause");
            expect(receipt.result?.transactions).toEqual([
              { stage: "approve-operator", txHash: HASH("a"), receipt: null },
            ]);
            expect(services.pause).toHaveBeenCalledTimes(1);
            expect(services.reconcile).toHaveBeenCalledTimes(1);
          });

          '''
          tests.write_text(text[:start] + partial_test + text[end:])

          console = Path("apps/explorer/src/components/BossLifecycleConsole/index.tsx")
          text = console.read_text()
          replacements = {
              "Prepare one explicit account top-up in token base units. No approval or deposit is hidden.":
                  "Prepare one explicit new fixed-budget target in token base units. No approval or deposit is hidden.",
              "Top-up amount must be a positive canonical decimal integer in token base units":
                  "New fixed budget must be a positive canonical decimal integer in token base units",
              "Amount in token base units": "New fixed budget in token base units",
              "<ReviewField label='Amount' value={review.amount?.toString() ?? \"None\"} />":
                  "<ReviewField label='New fixed budget' value={review.amount?.toString() ?? \"None\"} />",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"console copy no longer matches reviewed head: {old!r}")
              text = text.replace(old, new, 1)
          console.write_text(text)
          PY

      - name: Apply exact repository formatter
        run: >-
          pnpm exec biome check --write
          apps/explorer/src/components/BossLifecycleConsole/index.tsx
          apps/explorer/src/services/boss/lifecycle.test.ts
          apps/explorer/src/services/boss/lifecycle.ts

      - name: Generate and build distinct Boss and Pay types
        run: pnpm --filter @filecoin-pay/types build

      - name: Run Boss lifecycle and inherited regressions
        run: pnpm --filter @filecoin-pay/explorer test -- src/services/boss

      - name: Type check D3 surface
        run: pnpm --filter @filecoin-pay/explorer exec tsc --project tsconfig.boss-d3.json --noEmit

      - name: Build monorepo
        run: pnpm build
        env:
          NEXT_PUBLIC_SUBGRAPH_URL_MAINNET: https://placeholder.invalid/mainnet
          NEXT_PUBLIC_SUBGRAPH_URL_CALIBRATION: https://placeholder.invalid/calibration

      - name: Verify exact formatting and lint
        run: >-
          pnpm exec biome ci
          apps/explorer/src/components/BossLifecycleConsole/index.tsx
          apps/explorer/src/services/boss/lifecycle.test.ts
          apps/explorer/src/services/boss/lifecycle.ts

      - name: Publish qualified semantic repair
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            apps/explorer/src/components/BossLifecycleConsole/index.tsx \
            apps/explorer/src/services/boss/lifecycle.test.ts \
            apps/explorer/src/services/boss/lifecycle.ts | sort)"
          git add \
            apps/explorer/src/components/BossLifecycleConsole/index.tsx \
            apps/explorer/src/services/boss/lifecycle.test.ts \
            apps/explorer/src/services/boss/lifecycle.ts
          git commit -m "fix(explorer): match exact Synapse lifecycle evidence"

          auth_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          remote_head=$(git ls-remote "$auth_url" refs/heads/gpt56/issue-17-boss-console-release | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          git push "$auth_url" "HEAD:refs/heads/gpt56/issue-17-boss-console-release"
